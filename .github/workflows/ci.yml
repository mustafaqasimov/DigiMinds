name: Engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/*.test.mjs
      - run: python tools/load_test.py --isolated --requests 1000
      - run: python tools/flood_test.py --requests 600 --output flood-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sos-flood-results
          path: flood-results.json
  windows-start:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Windows setup and HTTP startup
        shell: cmd
        env:
          DATABASE_PATH: ${{ runner.temp }}/digiminds-start.db
        run: call BASLAT.cmd --smoke-test
  capacity-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify live reroute and one-click capacity response
        run: node tools/verify_capacity.mjs
